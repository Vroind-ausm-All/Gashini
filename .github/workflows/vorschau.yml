name: Prüfen und Vorschau

# Prüft jeden Stand (Generator-Drift, Links, Seitengrundlagen, Formular-Backend, Browser).
# Ist ein Push auf claude/relaunch-premium grün, startet der letzte Job die Pages-Vorschau im Hauptzweig: Dort
# baut „Vorschau auf GitHub Pages“ den bisherigen Auftritt unter / und diesen geprüften Stand unter /relaunch/
# (https://vroind-ausm-all.github.io/Gashini/relaunch/). Deployt wird nur aus dem Hauptzweig, weil nur er in die
# Umgebung github-pages veröffentlichen darf.

on:
  push:
    branches: [claude/affectionate-pascal-xxw1o2, claude/relaunch-premium]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeugversionen
        run: python3 --version && php --version | head -1

      - name: Seiten erzeugen
        run: python3 scripts/build-site.py

      - name: web/ entspricht der Quelle
        run: |
          if ! git diff --quiet -- web/ || [ -n "$(git ls-files --others --exclude-standard web/)" ]; then
            echo "::error::web/ weicht vom Generator ab. Lokal 'python3 scripts/build-site.py' ausführen und web/ einchecken."
            git status --short web/ | head -20
            exit 1
          fi

      - name: Statische Prüfungen
        run: CI=1 python3 tests/pruefen.py

      - name: Formular-Backend
        run: python3 tests/formular_test.py

  browser:
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 3D-Bündel und GSAP entsprechen der Quelle
        working-directory: scripts/werkzeuge/3d
        run: |
          npm ci
          npm run bauen
          if ! git diff --quiet -- ../../../src/assets/js; then
            echo "::error::src/assets/js weicht vom Werkzeug ab. 'cd scripts/werkzeuge/3d && npm run bauen' ausführen und einchecken."
            git status --short ../../../src/assets/js
            exit 1
          fi
      - name: Testabhängigkeiten
        working-directory: tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser-Tests
        working-directory: tests
        env:
          BERICHT_VERZEICHNIS: ${{ runner.temp }}/bericht
        run: node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-bericht
          path: ${{ runner.temp }}/bericht

  pages-ausloesen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/relaunch-premium'
    needs: [pruefen, browser]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Pages-Vorschau mit diesem Stand neu veröffentlichen (/relaunch/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run vorschau.yml --repo "$GITHUB_REPOSITORY" --ref claude/affectionate-pascal-xxw1o2 -f relaunch="$GITHUB_SHA"
