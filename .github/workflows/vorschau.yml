name: Vorschau auf GitHub Pages

# Baut den Webauftritt und stellt ihn als nicht indexierbare Vorschau bereit.
# Einmalig nötig: Repository → Settings → Pages → Source auf "GitHub Actions" stellen.

on:
  push:
    branches: [claude/affectionate-pascal-xxw1o2]
    paths:
      - 'web/**'
      - 'brand/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/vorschau.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Firmendaten einsetzen
        run: |
          bash scripts/firmendaten.sh || echo "::warning::Es sind noch Platzhalter offen – siehe Ausgabe oben."

      - name: Als Vorschau kennzeichnen und für Suchmaschinen sperren
        run: python3 scripts/vorschau-markieren.py dist/web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
